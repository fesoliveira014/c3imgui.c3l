name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: c3imgui.c3l
      # The imgui vulkan backend (backend/imgui_vulkan.c3i) imports `vk`, so any
      # consumer of the c3imgui module tree needs vk.c3l on the search path —
      # even a GL-only one, since c3c parses the whole library module tree.
      - uses: actions/checkout@v4
        with:
          repository: fesoliveira014/vk.c3l
          path: vk.c3l
          # vk.c3l is private; the default GITHUB_TOKEN is scoped to this repo
          # only. CI_PAT is a fine-grained PAT with Contents:read on vk.c3l.
          token: ${{ secrets.CI_PAT }}
      - name: install c3c 0.8.0
        run: |
          curl -L -o c3c.tar.gz https://github.com/c3lang/c3c/releases/download/v0.8.0/c3-linux.tar.gz
          tar xf c3c.tar.gz
          echo "$PWD/c3" >> "$GITHUB_PATH"
      - name: smoke compile (static-lib, no dcimgui/SDL3/GL link needed)
        run: |
          mkdir smoke && cd smoke
          cat > project.json <<'JSON'
          {
            "langrev": "1",
            "dependency-search-paths": [ ".." ],
            "dependencies": [ "c3imgui", "vk" ],
            "sources": [ "main.c3" ],
            "targets": { "smoke": { "type": "static-lib" } }
          }
          JSON
          cat > main.c3 <<'C3'
          module smoke;
          import imgui;
          fn void use() { int k = imgui::KEY_NAMED_KEY_BEGIN; }
          C3
          c3c build smoke
