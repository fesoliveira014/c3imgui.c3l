name: release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  SDL3_TAG: release-3.4.16
  VULKAN_HEADERS_TAG: vulkan-sdk-1.4.357.0

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: fetch Dear ImGui and dear_bindings
        run: bash scripts/bootstrap.sh
      - name: generate the C API
        run: bash scripts/generate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: generated
          path: generated
          if-no-files-found: error

  build-linux:
    needs: generate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: fetch Dear ImGui
        run: bash scripts/bootstrap.sh
      - uses: actions/download-artifact@v4
        with:
          name: generated
          path: generated
      - name: install clang, ninja and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libvulkan-dev libgl-dev
      - name: SDL3 headers
        run: git clone --quiet --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL.git sdl-src
      - name: build libdcimgui.a
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_FLAGS_RELEASE=-O2 -DCMAKE_C_FLAGS_RELEASE=-O2 \
            -DSDL3_INCLUDE_DIR="$PWD/sdl-src/include"
          cmake --build build --parallel
          mkdir -p linked-libs/linux-x64
          cp build/libdcimgui.a linked-libs/linux-x64/
          ls -l linked-libs/linux-x64/libdcimgui.a
      - name: no libc symbols newer than glibc 2.35
        run: |
          if nm -A -u linked-libs/linux-x64/libdcimgui.a | grep -E '__isoc23_|(^|[ _])(strlcpy|strlcat|wcslcpy|wcslcat)$'; then
            echo "archive references glibc symbols newer than 2.35"; exit 1
          fi
      - name: install c3c 0.8.3
        run: |
          curl -fsSL -o c3c.tar.gz https://github.com/c3lang/c3c/releases/download/v0.8.3/c3-linux-static.tar.gz
          tar xf c3c.tar.gz
          echo "$PWD/c3" >> "$GITHUB_PATH"
      - name: draw data runtime smoke against the fresh archive
        run: |
          c3c compile-run \
            tests/draw_data_smoke.c3 \
            imgui.c3i \
            --run-once \
            --safe=yes \
            -L linked-libs/linux-x64 \
            -l dcimgui -l stdc++ -l m
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: linked-libs/linux-x64/libdcimgui.a
          if-no-files-found: error

  build-windows:
    needs: generate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: fetch Dear ImGui
        shell: bash
        run: bash scripts/bootstrap.sh
      - uses: actions/download-artifact@v4
        with:
          name: generated
          path: generated
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: vulkan-headers
      - name: SDL3 headers
        shell: bash
        run: git clone --quiet --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL.git sdl-src
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: build dcimgui.lib
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS_RELEASE=/O2 -DCMAKE_C_FLAGS_RELEASE=/O2 `
            -DSDL3_INCLUDE_DIR="$PWD/sdl-src/include" `
            -DVULKAN_INCLUDE_DIR="$PWD/vulkan-headers/include"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          New-Item -ItemType Directory -Force linked-libs/windows-x64 | Out-Null
          Copy-Item build/dcimgui.lib linked-libs/windows-x64/dcimgui.lib
          Get-Item linked-libs/windows-x64/dcimgui.lib
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: linked-libs/windows-x64/dcimgui.lib
          if-no-files-found: error

  package:
    needs: [generate, build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: c3imgui.c3l
      - uses: actions/download-artifact@v4
        with:
          name: generated
          path: generated
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-x64
          path: native/windows-x64
      - uses: actions/checkout@v4
        with:
          repository: fesoliveira014/vk.c3l
          path: vk.c3l
      - name: install c3c 0.8.3
        run: |
          curl -fsSL -o c3c.tar.gz https://github.com/c3lang/c3c/releases/download/v0.8.3/c3-linux-static.tar.gz
          tar xf c3c.tar.gz
          echo "$PWD/c3" >> "$GITHUB_PATH"
      - name: pack
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#v}"; else version=0.0.0-dev; fi
          mkdir -p dist
          for platform in linux-x64 windows-x64; do
            stage="$RUNNER_TEMP/stage-$platform"
            rm -rf "$stage"
            mkdir -p "$stage/backend" "$stage/linked-libs/$platform"
            cp c3imgui.c3l/manifest.json c3imgui.c3l/LICENSE c3imgui.c3l/README.md c3imgui.c3l/*.c3i "$stage/"
            cp c3imgui.c3l/backend/*.c3i "$stage/backend/"
            find generated -name LICENSE.IMGUI.txt -exec cp {} "$stage/" \;
            find "native/$platform" \( -name '*.a' -o -name '*.lib' \) -exec cp {} "$stage/linked-libs/$platform/" \;
            (cd "$stage" && find . -type f | sed 's|^\./||' | LC_ALL=C sort | zip -X -q "$GITHUB_WORKSPACE/dist/c3imgui-v$version-$platform.c3l" -@)
          done
          (cd dist && sha256sum ./*.c3l | sed 's|\./||' > SHA256SUMS && cat SHA256SUMS)
      - name: smoke compile packed artifacts
        run: |
          for artifact in dist/*.c3l; do
            dir="$RUNNER_TEMP/smoke-$(basename "$artifact" .c3l)"
            rm -rf "$dir"; mkdir -p "$dir"
            unzip -q "$artifact" -d "$dir"
            test -f "$dir/manifest.json"
            c3c compile-only --no-obj --libdir "$GITHUB_WORKSPACE" --lib vk "$dir"/*.c3i "$dir"/backend/*.c3i
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
      - name: publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
